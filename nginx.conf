server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Sitio de una sola página: cualquier ruta cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML embebe todos los assets (fuentes, imágenes, JS), así que
    # no debe cachearse agresivamente para poder actualizar el sitio.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
