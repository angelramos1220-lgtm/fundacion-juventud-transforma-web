server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Cabeceras de seguridad. nginx NO hereda add_header dentro de un bloque que
    # declare el suyo (por ejemplo Cache-Control), por eso se repiten en cada location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Activos con hash de contenido en el nombre: cache larga e inmutable.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # El HTML no se cachea, para que cada despliegue llegue de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Cualquier ruta con extension (un archivo): existe o 404. Nunca cae a index.html.
    location ~ "\.[A-Za-z0-9]{1,8}$" {
        try_files $uri =404;
    }

    # Rutas limpias sin extension (/, /proyectos, ...): sitio de una sola pagina -> index.html.
    location ~ "^/[A-Za-z0-9_/-]*$" {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo demas (llaves, espacios, caracteres raros): 404.
    location / {
        return 404;
    }
}
